<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>MindMesh Messages</title>

<link rel="stylesheet" href="/static/css/style.css">
<link rel="icon" href="/static/favicon.png">
<script src="/static/js/i18n.js"></script>

</head>

<body>

<div style="display:flex; gap:6px; margin:12px 0 0 12px;">
  <button class="btn small subtle" onclick="setLanguage('ru')">RU</button>
  <button class="btn small subtle" onclick="setLanguage('en')">EN</button>
  <button class="btn small subtle" onclick="setLanguage('he')">HE</button>
</div>

<div class="container">
<div class="card">

<h1 data-i18n="messages_title">✉️ MindMesh Messages</h1>
<p style="opacity:0.7;" data-i18n="messages_subtitle">Communication Center</p>

<hr>

<h3 data-i18n="messages_overview">Messages Overview</h3>

<div class="admin-card">

<div class="ideas-line">

<div class="ideas-left">
<b data-i18n="messages_unread">Unread Messages:</b>
<span id="messages_total">loading...</span>
</div>

<div class="ideas-right">
<button class="btn small" onclick="refreshMessages()" data-i18n="messages_refresh">
Refresh
</button>
</div>

</div>

</div>

<hr>

<h3 data-i18n="messages_dialogs">Dialogs</h3>

<div class="log" id="messages-list">
Loading...
</div>

<hr>

<h3 data-i18n="messages_quick_actions">Quick Actions</h3>

<div class="admin-card">

<div class="buttons">
<button class="btn small" data-i18n="messages_new">New Message</button>
<button class="btn small secondary" data-i18n="messages_templates">Templates</button>
<button class="btn small secondary" data-i18n="messages_notifications">Notifications</button>
</div>

</div>

</div>
</div>

<footer style="text-align:center; padding:15px; color:#666;">
  <div data-i18n="footer_text">MindMesh — structure instead of chaos</div>
  <div style="margin-top:6px;">
    <a href="mailto:mindmeshbasic@gmail.com">mindmeshbasic@gmail.com</a>
  </div>
</footer>

<script src="/static/js/messages_panel.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
  if (typeof applyTranslations === "function") {
    applyTranslations();
  }
});
</script>

</body>
</html>
